<svg xmlns="http://www.w3.org/2000/svg" width="262" height="150" viewBox="0 0 262 150" fill="none" role="img" aria-label="CODE 9 repositórios públicos"><style>.bg{fill:#161b22}.ti{font:700 15px "Consolas",monospace;fill:#58a6ff;letter-spacing:2px}.nu{font:800 44px "Segoe UI",system-ui,sans-serif;fill:#e6edf3}.la{font:400 13px "Segoe UI",system-ui,sans-serif;fill:#8b949e}.pop{opacity:0;animation:pop .6s ease forwards;animation-delay:0.1s}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.ring{animation:ring 2.4s ease-in-out infinite}@keyframes ring{0%,100%{opacity:.25;r:7}50%{opacity:.9;r:10}}.sh{animation:sh 3.6s ease-in-out infinite}@keyframes sh{0%,55%{transform:translateX(-140%)}100%{transform:translateX(320%)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}</style><rect class="bg" x="0" y="0" width="262" height="150" rx="14"/><rect x="0" y="0" width="262" height="4" rx="2" fill="#58a6ff"/><circle class="ring" cx="236" cy="30" r="7" fill="none" stroke="#58a6ff" stroke-width="2"/><text class="ti pop" x="22" y="40">CODE</text><text class="nu pop" x="22" y="100">9</text><text class="la pop" x="22" y="126">repositórios públicos</text><clipPath id="c"><rect x="0" y="0" width="262" height="150" rx="14"/></clipPath><g clip-path="url(#c)"><rect class="sh" x="-120" y="0" width="70" height="150" fill="#ffffff" opacity="0.06"/></g></svg>