<svg xmlns="http://www.w3.org/2000/svg" width="820" height="210" viewBox="0 0 820 210" fill="none" role="img" aria-label="Matheus Nunes Boraso"><style>.bg{fill:#161b22}.n1{font:700 46px "Segoe UI",system-ui,sans-serif;fill:#e6edf3}.n2{font:700 46px "Segoe UI",system-ui,sans-serif;fill:#58a6ff}.sub{font:400 18px "Segoe UI",system-ui,sans-serif;fill:#8b949e}.tag{font:600 13px "Consolas",monospace;fill:#58a6ff}.rise{opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}@keyframes rise{to{opacity:1;transform:translateY(0)}}.shine{animation:shine 3.2s ease-in-out infinite}@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(320%)}}.dot{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}</style><rect class="bg" x="0" y="0" width="820" height="210" rx="16"/><rect x="0" y="0" width="6" height="210" rx="3" fill="#58a6ff"/><g transform="translate(44,92)"><text class="n1 rise d1" x="0" y="0">MATHEUS NUNES</text><text class="n2 rise d2" x="0" y="52">BORASO</text><clipPath id="cb"><rect x="0" y="22" width="210" height="46"/></clipPath><g clip-path="url(#cb)"><rect class="shine" x="-120" y="22" width="90" height="46" fill="#ffffff" opacity="0.14"/></g></g><text class="sub rise d3" x="46" y="176">Dev @ Netbil Educacional</text><circle class="dot" cx="330" cy="170" r="4" fill="#58a6ff"/><text class="tag rise d4" x="46" y="200">Next.js · React Native · Node.js · TypeScript · ☕</text></svg>