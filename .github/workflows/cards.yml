name: Profile cards

on:
  schedule:
    - cron: "17 4 * * *"   # todo dia ~01h BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools Pillow

      - name: Atualiza dados de contribuição
        env:
          # GITHUB_TOKEN lê o calendário público. Para incluir contribuições
          # privadas, crie um PAT (scope read:user) em secrets como CARDS_TOKEN
          # e troque a linha abaixo por: ${{ secrets.CARDS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Renderiza os cards
        run: python scripts/render_readme_cards.py

      - name: Commita se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          git diff --quiet --staged || git commit -m "chore(cards): atualiza cards do perfil"
          git push
